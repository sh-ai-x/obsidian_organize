title: "Obsidian topic-organizer plugin"
status: design-discussion
issue: 2
date: 2026-09-05
tags: [obsidian-topic-organizer, plugin, pkm, hermes-wiki-super]

sections:
  - title: "§1 — Frame"
    body: |
      - **goal**: Ship a Claude Code plugin that organizes an Obsidian vault by topic, exposing three skills — research (gather source material), add_wiki (promote to topic note), remove_wiki (withdraw topic + staged inputs) — with frontmatter + tag conventions inherited from hermes-wiki-super's add-wiki / process-clippings skills.
      - **target user**: Solo PKM practitioner — one developer maintaining their own Obsidian vault; runs Claude Code locally; values reproducibility of the topic-organize workflow over collaborative features.
      - **situation**: The user runs add-wiki and process-clippings skills manually against `~/Documents/Obsidian Vault/hermes-wiki-super`; topic structure exists but no first-class research/add_wiki/remove_wiki workflow.

  - title: "§2 — Validate"
    body: |
      | Dimension | Result |
      |---|---|
      | Evidence | 3 sources (vault add-wiki, vault process-clippings, dev-harness-kit namespace convention) |
      | Value score | best-effort (personal dogfood: LTV=$0, users=1, cost=$0; formula's commercial-value premise doesn't match) |
      | Ambiguity | loop skipped (best-effort gate short-circuits convergence test) |
      | Convergence | PASS (best-effort overrides value_score dimension) |

      Constraints: `namespace:skill` naming (e.g. `obsidian-organize:research`); additive over existing skills, not replacement.

  - title: "§3 — Non-goals"
    body: |
      1. No bidirectional Obsidian sync (mobile/cloud). Rationale: different problem space, Obsidian Sync exists. Breach-response: defer to Obsidian Sync.
      2. No migration tooling for pre-existing topic notes. Rationale: migration is one-shot; not a runtime concern. Breach-response: one-off script on request.
      3. No LLM-judge evaluation harness for plugin outputs. Rationale: covered by `/dev-kit:evaluate`. Breach-response: per-skill tests in plugin; harness is project-level.

  - title: "§4 — Phase plan"
    body: |
      Phase state machine: `phases/obsidian-topic-organizer/index.json`. Per-step preambles: `step<N>.md` (N=0..4). Step ordering is dependency-first.

      | Step | Title | Depends on |
      |---|---|---|
      | 0 | Plugin scaffold + manifest | — |
      | 1 | research skill | 0 |
      | 2 | add_wiki skill | 0, 1 |
      | 3 | remove_wiki skill | 0, 2 |
      | 4 | Vault fixture + per-skill tests + integration test | 1, 2, 3 |

  - title: "§5 — Acceptance criteria"
    body: |
      | AC | Step | Command |
      |---|---|---|
      | AC-1 | 0 | `jq . plugins/obsidian-organize/.claude-plugin/plugin.json` |
      | AC-2 | 1 | `test -f plugins/obsidian-organize/skills/research/{SKILL.md,references/output-schema.md}` |
      | AC-3 | 2 | `test -f plugins/obsidian-organize/skills/add_wiki/{SKILL.md,references/frontmatter.md}` |
      | AC-4 | 3 | `test -f plugins/obsidian-organize/skills/remove_wiki/{SKILL.md,references/cleanup-rules.md}` |
      | AC-5 | 4 | `pytest plugins/obsidian-organize/tests/ -v` |

  - title: "§6 — Hand-off"
    body: |
      - Review artifact: `/dev-kit:proposal plugins/obsidian-topic-organizer` → `docs/proposals/plugins/obsidian-topic-organizer.html`
      - Next stage: `/dev-kit:build obsidian-topic-organizer`
      - Review chain: `/dev-kit:review` (3-dim) → `/dev-kit:security` (10-dim) → `/dev-kit:ship`.
